<div style="border: 1px solid #ccc; padding: 10px; box-sizing: border-box;">

    <div style="margin-bottom: 15px;">
        <mat-form-field appearance="outline" style="width: 100%;">
            <textarea matInput [(ngModel)]="content" rows="5" placeholder="Enter text here"></textarea>
        </mat-form-field>
    </div>

    <div>
        <button mat-button (click)="onSave()">Save</button>
        <button mat-button (click)="onCancel()">Cancel</button>
    </div>
</div>
